services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: text_creation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - text_creation_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d text_creation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  text_creation_postgres:
